name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OidcSolution.slnx

      - name: Build
        run: dotnet build OidcSolution.slnx --no-restore --configuration Release

      - name: Install Playwright browsers
        run: pwsh EndToEndTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Unit and integration tests
        run: dotnet test IntegrationTests/IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: End-to-end tests
        run: dotnet test EndToEndTests/EndToEndTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

